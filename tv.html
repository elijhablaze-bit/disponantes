<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scanner Universel V2</title>
    <style>
        :root { --glow: #00ff41; --bg: #050505; }
        body { background: var(--bg); color: var(--glow); font-family: 'Courier New', monospace; padding: 15px; margin: 0; }
        
        .terminal { border: 1px solid var(--glow); padding: 15px; border-radius: 12px; box-shadow: 0 0 20px rgba(0, 255, 65, 0.15); }
        
        .header { border-bottom: 1px solid var(--glow); margin-bottom: 15px; padding-bottom: 10px; font-size: 11px; text-align: center; }
        
        .input-group { display: flex; gap: 8px; margin-bottom: 15px; }
        input { flex: 2; background: #111; color: var(--glow); border: 1px solid #333; padding: 12px; border-radius: 8px; font-family: monospace; font-size: 16px; }
        input:focus { outline: none; border-color: var(--glow); }
        
        button { flex: 1; background: var(--glow); color: #000; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        button:disabled { background: #004411; color: #008822; }

        .progress { height: 4px; background: #111; margin: 15px 0; border-radius: 2px; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--glow); width: 0%; transition: width 0.2s; }

        .found-card { background: #00ff41; color: #000; padding: 12px; margin: 10px 0; border-radius: 8px; font-weight: 800; font-size: 13px; box-shadow: 0 4px 15px rgba(0,255,65,0.3); }

        #log { font-size: 10px; height: 150px; overflow-y: auto; color: rgba(0, 255, 65, 0.5); border-top: 1px solid #222; padding-top: 10px; margin-top: 10px; }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header">
        [ SYSTEM READY ]<br>
        DEVICE_SCANNER_V2.0_UNIV
    </div>

    <label style="font-size: 9px; margin-bottom: 5px; display: block;">ENTREZ LE DÉBUT DE L'IP (EX: 192.168.1) :</label>
    <div class="input-group">
        <input type="text" id="subnet" placeholder="Ex: 192.168.1" value="192.168.1">
        <button id="btn" onclick="startScan()">SCAN</button>
    </div>

    <div class="progress"><div id="p-bar" class="progress-bar"></div></div>
    
    <div id="results"></div>
    <div id="log">En attente de commande...</div>
</div>

<script>
    const sleep = ms => new Promise(r => setTimeout(r, ms));

    async function startScan() {
        const subnet = document.getElementById('subnet').value.trim();
        const log = document.getElementById('log');
        const res = document.getElementById('results');
        const pBar = document.getElementById('p-bar');
        const btn = document.getElementById('btn');

        if(!subnet || subnet.split('.').length < 2) {
            alert("Format invalide. Utilisez X.X.X (ex: 192.168.1)");
            return;
        }

        btn.disabled = true;
        res.innerHTML = "";
        log.innerHTML = `[!] Déclenchement du scan sur ${subnet}.x...<br>`;

        // Ports les plus communs pour écrans et appareils connectés
        const ports = [80, 8008, 8009, 5000, 7000];

        for(let i = 1; i < 255; i++) {
            const ip = `${subnet}.${i}`;
            pBar.style.width = `${(i/254)*100}%`;
            
            if(i % 15 === 0) log.innerHTML += `Test de la zone ${ip}...<br>`;
            if(log.innerHTML.length > 500) log.innerHTML = log.innerHTML.slice(-300);

            // On teste chaque port
            ports.forEach(async (port) => {
                const controller = new AbortController();
                const timeout = setTimeout(() => controller.abort(), 900);

                try {
                    await fetch(`http://${ip}:${port}`, { mode: 'no-cors', signal: controller.signal });
                    
                    // Identification simplifiée
                    let label = "APPAREIL";
                    if(port === 80) label = "INTERFACE WEB / ADMIN";
                    if(port === 8008 || port === 8009) label = "CHROMECAST / SMART TV";
                    if(port === 5000 || port === 7000) label = "AIRPLAY / APPLE";

                    res.innerHTML += `
                        <div class="found-card">
                            ⚡ CIBLE DÉTECTÉE<br>
                            IP : ${ip}:${port}<br>
                            SERVICE : ${label}
                        </div>`;
                } catch (e) {}
                clearTimeout(timeout);
            });

            // Pause furtive pour iPhone
            await sleep(70 + Math.random() * 40);
            log.scrollTop = log.scrollHeight;
        }

        log.innerHTML += "<br>[+] SCAN TERMINÉ.";
        btn.disabled = false;
    }
</script>

</body>
</html>

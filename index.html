<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Salles libres</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #F2F2F7; padding: 15px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 15px; }
        input { width: 100%; padding: 12px; border: 1px solid #D1D1D6; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; background: #007AFF; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 17px; font-weight: 600; }
        .result-item { background: white; padding: 15px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; border-left: 5px solid #34C759; }
    </style>
</head>
<body>

<div class="card">
    <h1>Salles libres</h1>
    <input type="date" id="date">
    <div style="display:flex; gap:10px;">
        <input type="time" id="start" value="08:00">
        <input type="time" id="end" value="10:00">
    </div>
    <button onclick="checkRooms()">Vérifier</button>
    <p id="status" style="text-align:center; color:#8E8E93;"></p>
</div>

<div id="results"></div>

<script>
    const SALLES = [
        {"nom": "Bias 2 Amphi A", "code": "109269"},
        {"nom": "Bias 2 Amphi B", "code": "109270"},
        {"nom": "Bias 2 Amphi C", "code": "109271"}
        // Ajoute les autres codes ici si le test fonctionne
    ];

    document.getElementById('date').valueAsDate = new Date();

    async function checkRooms() {
        const resultsDiv = document.getElementById('results');
        const status = document.getElementById('status');
        const dateR = document.getElementById('date').value.replace(/-/g, "");
        const startR = parseInt(document.getElementById('start').value.replace(":", ""));
        const endR = parseInt(document.getElementById('end').value.replace(":", ""));

        status.innerText = "Recherche en cours...";
        resultsDiv.innerHTML = "";

        const promises = SALLES.map(async (salle) => {
            try {
                // NOUVELLE URL (Plus complète)
                const target = `https://edt.univ-nantes.fr/medecine/g${salle.code}.ics`;
                const url = `https://api.allorigins.win/get?url=${encodeURIComponent(target)}&t=${Date.now()}`;
                
                const res = await fetch(url);
                const json = await res.json();
                
                // Si le fichier contient "VEVENT", on analyse, sinon on considère la salle LIBRE
                if (json.contents && json.contents.includes("BEGIN:VEVENT")) {
                    if (isOccupied(json.contents, dateR, startR, endR)) return null;
                }
                return salle.nom;
            } catch (e) { return null; }
        });

        const results = await Promise.all(promises);
        const libres = results.filter(n => n !== null);

        status.innerText = "";
        libres.forEach(nom => {
            resultsDiv.innerHTML += `<div class="result-item"><span>${nom}</span><span>✅</span></div>`;
        });
    }

    function isOccupied(data, dateR, startR, endR) {
        const events = data.split("BEGIN:VEVENT");
        for (let i = 1; i < events.length; i++) {
            const ev = events[i];
            const sd = ev.match(/DTSTART[:;](?:.*T)?(\d{8}T\d{4})/);
            const ed = ev.match(/DTEND[:;](?:.*T)?(\d{8}T\d{4})/);
            
            if (sd && ed) {
                if (sd[1].slice(0, 8) === dateR) {
                    let hs = parseInt(sd[1].slice(9, 13)) + 100; // Correction UTC+1
                    let he = parseInt(ed[1].slice(9, 13)) + 100;
                    if (hs < endR && he > startR) return true;
                }
            }
        }
        return false;
    }
</script>
</body>
</html>

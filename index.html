<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salles Libres Nantes</title>
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; --bias2: #5856D6; --bias: #FF9500; --veil: #AF52DE; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); margin: 0; padding: 15px; padding-bottom: 50px; color: #1C1C1E; }
        
        /* Formulaire */
        .card { background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); margin-bottom: 25px; border: 1px solid rgba(0,0,0,0.05); }
        h1 { font-size: 24px; text-align: center; margin: 0 0 20px 0; font-weight: 800; letter-spacing: -0.5px; }
        label { display: block; font-size: 11px; font-weight: 700; color: #8E8E93; margin-bottom: 5px; text-transform: uppercase; margin-left: 5px; }
        input { width: 100%; padding: 14px; border: 1px solid #E5E5EA; border-radius: 12px; font-size: 16px; margin-bottom: 12px; box-sizing: border-box; background: #F9F9F9; transition: all 0.2s; }
        input:focus { border-color: var(--primary); background: white; outline: none; }
        
        /* Bouton et Progress Bar */
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 16px; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; transition: transform 0.1s, opacity 0.2s; }
        button:active { transform: scale(0.98); opacity: 0.9; }
        button:disabled { background: #D1D1D6; }
        
        .progress-container { width: 100%; background: #E5E5EA; border-radius: 10px; height: 4px; margin: 15px 0; display: none; overflow: hidden; }
        .progress-bar { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s; }
        #status { text-align: center; font-size: 12px; color: #8E8E93; margin-bottom: 10px; font-weight: 500; }

        /* Sections et Résultats */
        .section-title { font-size: 14px; font-weight: 700; margin: 25px 0 12px 10px; color: #8E8E93; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; }
        .dot { height: 8px; width: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
        .building-container { display: none; margin-bottom: 25px; }
        
        .result-item { background: white; padding: 16px; border-radius: 16px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 8px rgba(0,0,0,0.04); animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid rgba(0,0,0,0.02); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .salle-nom { font-weight: 600; font-size: 17px; color: #000; }
        .check { color: #34C759; font-size: 18px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Salles Libres</h1>
    <label>Date</label>
    <input type="date" id="date">
    <div style="display:flex; gap:12px;">
        <div style="flex:1"><label>Début</label><input type="time" id="start" value="08:00"></div>
        <div style="flex:1"><label>Fin</label><input type="time" id="end" value="10:00"></div>
    </div>
    
    <div id="status">Sélectionnez vos horaires</div>
    <div class="progress-container" id="p-cont"><div class="progress-bar" id="p-bar"></div></div>
    
    <button id="btn" onclick="checkRooms()">Rechercher</button>
</div>

<div id="results">
    <div id="sect-Bias2" class="building-container">
        <div class="section-title"><span class="dot" style="background:var(--bias2)"></span>Bâtiment Bias 2</div>
        <div class="list"></div>
    </div>
    <div id="sect-Bias" class="building-container">
        <div class="section-title"><span class="dot" style="background:var(--bias)"></span>Bâtiment Bias</div>
        <div class="list"></div>
    </div>
    <div id="sect-Veil" class="building-container">
        <div class="section-title"><span class="dot" style="background:var(--veil)"></span>Simone Veil</div>
        <div class="list"></div>
    </div>
</div>

<script>
    // Liste des salles (Gardée telle quelle pour ne pas casser la logique de code)
    const SALLES = [
        {"nom": "Bias 2 Amphi A", "code": "109269"}, {"nom": "Bias 2 Amphi B", "code": "109270"},
        {"nom": "Bias 2 Amphi C", "code": "109271"}, {"nom": "Bias 2 Salle 004", "code": "109264"},
        {"nom": "Bias 2 Salle 005", "code": "109265"}, {"nom": "Bias 2 Salle 006", "code": "109266"},
        {"nom": "Bias 2 Salle 007", "code": "109267"}, {"nom": "Bias Amphi Virginie Ferré", "code": "109250"},
        {"nom": "Bias Salle 051", "code": "109248"}, {"nom": "Bias Salle 052", "code": "109249"},
        {"nom": "Bias Salle 117", "code": "109252"}, {"nom": "Bias Salle 121", "code": "109254"},
        {"nom": "Bias Salle 161-122", "code": "109258"}, {"nom": "Bias Salle 162", "code": "109259"},
        {"nom": "Bias Salle 163-164", "code": "109260"}, {"nom": "Bias Salle 165", "code": "109261"},
        {"nom": "Bias Salle 166", "code": "109221"}, {"nom": "Bias Salle 167", "code": "109222"},
        {"nom": "Bias Salle 205", "code": "109225"}, {"nom": "Bias Salle 207", "code": "109190"},
        {"nom": "Bias Salle 208", "code": "109262"}, {"nom": "Bias Salle 211", "code": "109263"},
        {"nom": "Bias Salle A442", "code": "109212"}, {"nom": "Veil Salle 201A", "code": "109228"},
        {"nom": "Veil Salle 243", "code": "109278"}, {"nom": "Veil Salle 244", "code": "109233"},
        {"nom": "Veil Salle 301A", "code": "109172"}, {"nom": "Veil Salle 301B", "code": "109234"},
        {"nom": "Veil Salle 302", "code": "109186"}, {"nom": "Veil Salle 303", "code": "109187"},
        {"nom": "Veil Salle 338", "code": "109188"}, {"nom": "Veil Salle 339", "code": "109173"},
        {"nom": "Veil Salle 340", "code": "109174"}, {"nom": "Veil Salle 341", "code": "109175"},
        {"nom": "Veil Salle 447", "code": "109176"}, {"nom": "Veil Salle 502", "code": "109177"},
        {"nom": "Veil Salle 503", "code": "109178"}, {"nom": "Veil Salle 504", "code": "109179"},
        {"nom": "Veil Salle 554", "code": "109180"}, {"nom": "Veil Salle 555", "code": "109181"},
        {"nom": "Veil Amphi 1", "code": "109182"}, {"nom": "Veil Amphi 2", "code": "109183"},
        {"nom": "Veil Amphi 3", "code": "109184"}, {"nom": "Veil Amphi 4", "code": "109185"},
        {"nom": "Veil Amphi 5", "code": "109220"}, {"nom": "Veil Amphi 6", "code": "109235"},
        {"nom": "Veil Amphi 7", "code": "109236"}, {"nom": "Veil Amphi 8", "code": "109174"},
        {"nom": "Veil Amphi 9", "code": "109237"}
    ];

    document.getElementById('date').valueAsDate = new Date();

    async function checkRooms() {
        const btn = document.getElementById('btn');
        const status = document.getElementById('status');
        const pBar = document.getElementById('p-bar');
        const pCont = document.getElementById('p-cont');
        
        const dateR = document.getElementById('date').value.replace(/-/g, "");
        const startR = parseInt(document.getElementById('start').value.replace(":", ""));
        const endR = parseInt(document.getElementById('end').value.replace(":", ""));

        btn.disabled = true;
        pCont.style.display = "block";
        pBar.style.width = "0%";
        
        document.querySelectorAll('.building-container').forEach(c => {
            c.style.display = 'none';
            c.querySelector('.list').innerHTML = '';
        });

        for (let i = 0; i < SALLES.length; i++) {
            const salle = SALLES[i];
            pBar.style.width = ((i + 1) / SALLES.length * 100) + "%";
            status.innerText = `Recherche : ${i+1}/${SALLES.length}`;

            try {
                const target = `http://edt-v2.univ-nantes.fr/calendar/ics?timetables[0]=${salle.code}`;
                const url = `https://corsproxy.io/?${encodeURIComponent(target)}&t=${Date.now()}`;
                const res = await fetch(url);
                const text = await res.text();
                
                if (!isOccupied(text, dateR, startR, endR)) {
                    addRoomToUI(salle.nom);
                }
            } catch (e) {}
        }

        status.innerText = "Analyse terminée";
        btn.disabled = false;
        setTimeout(() => { pCont.style.display = "none"; }, 1500);
    }

    function addRoomToUI(nomBrut) {
        let containerId = "";
        let nomNettoye = nomBrut;

        // --- NETTOYAGE ET TRI ---
        if (nomBrut.startsWith("Bias 2")) {
            containerId = "sect-Bias2";
            nomNettoye = nomBrut.replace("Bias 2 ", "");
        } else if (nomBrut.toLowerCase().startsWith("veil")) {
            containerId = "sect-Veil";
            nomNettoye = nomBrut.replace(/Veil /i, "");
        } else if (nomBrut.toLowerCase().startsWith("bias")) {
            containerId = "sect-Bias";
            nomNettoye = nomBrut.replace(/Bias /i, "");
        }

        if (containerId) {
            const container = document.getElementById(containerId);
            container.style.display = 'block';
            container.querySelector('.list').innerHTML += `
                <div class="result-item">
                    <span class="salle-nom">${nomNettoye}</span>
                    <span class="check">􀁣</span>
                </div>`;
        }
    }

    function isOccupied(data, dateR, startR, endR) {
        if (!data.includes("BEGIN:VEVENT")) return false;
        const events = data.split("BEGIN:VEVENT");
        for (let i = 1; i < events.length; i++) {
            const ev = events[i];
            const sd = ev.match(/DTSTART[:;](?:.*T)?(\d{8}T\d{4})/);
            const ed = ev.match(/DTEND[:;](?:.*T)?(\d{8}T\d{4})/);
            if (sd && ed) {
                if (sd[1].slice(0, 8) === dateR) {
                    let hs = parseInt(sd[1].slice(9, 13)) + 100;
                    let he = parseInt(ed[1].slice(9, 13)) + 100;
                    if (hs < endR && he > startR) return true;
                }
            }
        }
        return false;
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Salles</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f0f2f5; }
        .card { background: white; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
        #debug-log { background: #000; color: #0f0; padding: 10px; font-family: monospace; font-size: 10px; height: 150px; overflow: auto; border-radius: 5px; margin-top: 10px; }
        .salle { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

<div class="card">
    <h3>🔍 Mode Diagnostic</h3>
    <button onclick="checkWithDebug()" style="width:100%; padding:15px; background:#007AFF; color:white; border:none; border-radius:10px;">Lancer le Test</button>
    <div id="debug-log">Attente du test...</div>
</div>

<div id="results" class="card"></div>

<script>
    const TEST_SALLE = {"nom": "Bias 2 Amphi A", "code": "109269"};

    function log(msg) {
        const d = document.getElementById('debug-log');
        d.innerHTML += "> " + msg + "<br>";
        d.scrollTop = d.scrollHeight;
    }

    async function checkWithDebug() {
        const logDiv = document.getElementById('debug-log');
        const resDiv = document.getElementById('results');
        logDiv.innerHTML = "Début du test...<br>";
        
        const dateR = new Date().toISOString().split('T')[0].replace(/-/g, "");
        log("Date testée : " + dateR);

        try {
            const url = `https://api.allorigins.win/get?url=${encodeURIComponent(`http://edt-v2.univ-nantes.fr/calendar/ics?timetables[0]=${TEST_SALLE.code}`)}&t=${Date.now()}`;
            log("Appel du serveur fac...");
            
            const res = await fetch(url);
            const json = await res.json();
            
            if (!json.contents) {
                log("ERREUR : Le serveur n'a renvoyé aucun contenu.");
                return;
            }

            log("Contenu reçu ! Taille : " + json.contents.length + " caractères");
            
            if (json.contents.includes("BEGIN:VEVENT")) {
                log("OK : Des cours ont été trouvés dans le fichier.");
                // On affiche les 200 premiers caractères pour voir le format de l'heure
                log("Extrait : " + json.contents.substring(json.contents.indexOf("DTSTART"), json.contents.indexOf("DTSTART")+40));
            } else {
                log("ALERTE : Fichier reçu mais VIDE de cours.");
            }

            // Test de filtrage
            resDiv.innerHTML = "Analyse terminée. Regarde les logs verts.";

        } catch (e) {
            log("ERREUR FATALE : " + e.message);
        }
    }
</script>
</body>
</html>

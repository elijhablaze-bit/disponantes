<!DOCTYPE html>
<html>
<body style="font-family:sans-serif; padding:15px; background:#F2F2F7;">
    <div style="background:white; padding:20px; border-radius:15px; box-shadow:0 4px 10px rgba(0,0,0,0.1);">
        <h2 style="text-align:center;">Diagnostic Étape 5</h2>
        <button onclick="superScan()" style="width:100%; padding:15px; background:#34C759; color:white; border:none; border-radius:10px; font-weight:bold;">Scanner l'Amphi A</button>
        
        <div id="console" style="margin-top:20px; background:black; color:#0f0; padding:15px; font-family:monospace; font-size:11px; border-radius:5px; white-space:pre-wrap; min-height:300px;">
            Appuyez pour voir ce que l'iPhone reçoit vraiment...
        </div>
    </div>

<script>
async function superScan() {
    const out = document.getElementById('console');
    out.innerHTML = "--- DÉBUT DU SUPER SCAN ---\n";
    
    // Test avec l'URL v2 (celle de ton PC)
    const target = `https://edt-v2.univ-nantes.fr/calendar/ics?timetables[0]=109269`;
    
    // On essaye un Proxy différent (Corsproxy.io) pour voir si AllOrigins sature
    const proxy = `https://corsproxy.io/?`;
    const url = proxy + encodeURIComponent(target);

    out.innerHTML += "1. Tentative via Proxy de secours...\n";

    try {
        const res = await fetch(url);
        const text = await res.text();
        
        out.innerHTML += "2. Taille reçue : " + text.length + " caractères\n";
        out.innerHTML += "3. Début du contenu :\n\n";
        
        // On affiche les 300 premiers caractères pour voir si c'est du calendrier ou une erreur
        out.innerHTML += text.substring(0, 400).replace(/</g, "&lt;").replace(/>/g, "&gt;");
        
        if (text.includes("BEGIN:VEVENT")) {
            out.innerHTML += "\n\n✅ SUCCÈS : Le calendrier contient des cours !";
        } else {
            out.innerHTML += "\n\n❌ ÉCHEC : Pas de cours détectés dans ce texte.";
        }

    } catch (e) {
        out.innerHTML += "\nERREUR : " + e.message;
    }
}
</script>
</body>
</html>

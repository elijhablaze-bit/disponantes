<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Salles Libres</title>
    <link rel="apple-touch-icon" href="https://img.icons8.com/color/192/calendar--v1.png">
    <style>
        :root { --primary: #007AFF; --bg: #F2F2F7; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 20px; }
        h1 { font-size: 22px; margin: 0 0 20px 0; color: #000; text-align: center; }
        label { display: block; font-size: 14px; font-weight: 600; color: #8E8E93; margin-bottom: 5px; }
        input { width: 100%; padding: 12px; border: 1px solid #D1D1D6; border-radius: 10px; font-size: 16px; margin-bottom: 15px; box-sizing: border-box; -webkit-appearance: none; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; }
        .result-item { background: #E5E5EA; padding: 15px; border-radius: 10px; margin-top: 10px; display: flex; justify-content: space-between; font-weight: 500; }
        #status { text-align: center; font-size: 14px; color: var(--primary); margin-top: 10px; min-height: 20px; }
    </style>
</head>
<body>

<div class="card">
    <h1>Salles Libres Bias</h1>
    <label>Date</label>
    <input type="date" id="date">
    <div style="display:flex; gap:10px;">
        <div style="flex:1"><label>Début</label><input type="time" id="start" value="08:00"></div>
        <div style="flex:1"><label>Fin</label><input type="time" id="end" value="10:00"></div>
    </div>
    <button onclick="checkRooms()">Vérifier</button>
    <div id="status"></div>
</div>

<div id="results"></div>

<script>
    // Configuration des salles (Même liste que sur PC)
    const SALLES = [
        {nom: "Amphi A", id: "109269"},
        {nom: "Amphi B", id: "109270"},
        {nom: "Amphi C", id: "109271"}
    ];

    document.getElementById('date').valueAsDate = new Date();

    async function checkRooms() {
        const resultsDiv = document.getElementById('results');
        const status = document.getElementById('status');
        const dateRech = document.getElementById('date').value.replace(/-/g, "");
        const hStart = document.getElementById('start').value.replace(":", "") + "00";
        const hEnd = document.getElementById('end').value.replace(":", "") + "00";

        status.innerText = "Recherche en cours...";
        resultsDiv.innerHTML = "";

        let libres = [];

        for (let salle of SALLES) {
            try {
                // Utilisation d'un proxy pour éviter les blocages CORS sur mobile
                const url = `https://api.allorigins.win/get?url=${encodeURIComponent(`https://edt.univ-nantes.fr/medecine/g${salle.id}.ics`)}`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (!isOccupied(data.contents, dateRech, hStart, hEnd)) {
                    libres.push(salle.nom);
                }
            } catch (e) { console.error(e); }
        }

        status.innerText = "";
        if (libres.length === 0) {
            resultsDiv.innerHTML = "<div class='card' style='text-align:center'>Aucune salle libre ❌</div>";
        } else {
            libres.forEach(nom => {
                resultsDiv.innerHTML += `<div class="result-item"><span>${nom}</span><span>✅</span></div>`;
            });
        }
    }

    function isOccupied(icsData, dateR, startR, endR) {
        // Logique simplifiée pour analyser le fichier iCal directement
        const events = icsData.split("BEGIN:VEVENT");
        for (let event of events) {
            const startEv = event.match(/DTSTART[:;](?:.*T)?(\d{8}T\d{6})/);
            const endEv = event.match(/DTEND[:;](?:.*T)?(\d{8}T\d{6})/);
            
            if (startEv && endEv) {
                const s = startEv[1].replace("T", "");
                const e = endEv[1].replace("T", "");
                // Vérification du chevauchement
                if (s.slice(0,8) === dateR) {
                    const ts = s.slice(8);
                    const te = e.slice(8);
                    if (ts < endR && te > startR) return true;
                }
            }
        }
        return false;
    }
</script>
</body>
</html>
